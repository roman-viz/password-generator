<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.svg" type="image/x-icon">
    <script defer src="script.js"></script>
</head>

<body>
    <form action="#" class="myForm">
        <header class="formHeader">
            <h1>Password generator</h1>
        </header>
        <div class="genPass">
            <div class="genPass__output">
                <div class="genPass__text">
                    <input id="genPass" type="text" spellcheck="false" placeholder="Generate password" value="" readonly>
                    <button id="copy" class="copy" type="button" aria-label="Copy password"></button>
                    <span id="copyText" class="copyText">COPY!</span>
                </div>
                <span id="strengthLabel" class="strengthLabel" hidden></span>
            </div>
            <div class="genPass__button">
                <button id="genButton" type="submit">
                    Generate
                </button>
            </div>
        </div>
        <div class="reminder">
            <input id="reminder" type="text" spellcheck="false" placeholder="Remember your password" value="" readonly>
            <button id="copyReminder" class="copy" type="button" aria-label="Copy reminder"></button>
            <span id="copyReminderText" class="copyText">COPY!</span>
        </div>
        <div class="genOptions">
            <div class="genLength">                             
                <input id="genLength" type="number" min="4" max="50" value="8">
                <input id="genRange" type="range" min="4" max="50" value="8">
            </div>
            <div class="genType">
                <div class="chek1">
                    <input class="chekker" type="checkbox" id="Upper" checked>
                    <label for="Upper">Uppercase</label>
                </div>
                <div class="chek2">
                    <input class="chekker" type="checkbox" id="Lower" checked>
                    <label for="Lower">Lowercase</label>
                </div>
                <div class="chek3">
                    <input class="chekker" type="checkbox" id="Num">
                    <label for="Num">Numbers</label>
                </div>
                <div class="chek4">
                    <input class="chekker" type="checkbox" id="Symb">
                    <label for="Symb">Symbols</label>
                </div>
            </div>
        </div>
    </form>
</body>

</html>
